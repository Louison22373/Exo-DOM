<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Exercice 5</title>
  </head>
   <body>
    <div class="container">
      <!-- Chaque image change de source (this.src) au survol de la souris -->
      <img src="images/image1.jpg" id="image1" 
           onmouseover="this.src='images/image2.jpg'" 
           onmouseout="this.src='images/image1.jpg'" />

      <img src="images/image2.jpg" id="image2" 
           onmouseover="this.src='images/image3.jpg'" 
           onmouseout="this.src='images/image2.jpg'" />

      <img src="images/image3.jpg" id="image3" 
           onmouseover="this.src='images/image4.jpg'" 
           onmouseout="this.src='images/image3.jpg'" />

      <img src="images/image4.jpg" id="image4" 
           onmouseover="this.src='images/image5.jpg'" 
           onmouseout="this.src='images/image4.jpg'" />

      <img src="images/image5.jpg" id="image5" 
           onmouseover="this.src='images/image1.jpg'" 
           onmouseout="this.src='images/image5.jpg'" />
    </div>
  </body>
</html>
