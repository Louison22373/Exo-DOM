<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>document</title>
  </head>
  <body>
    <div class="container">
      <img src="images/image1.jpg" id="image1" onmouseover="changer()" />
    </div>

    <script>
      var numero = 1;

      function changer() {
        numero = numero + 1;

        if (numero == 2) {
          document.getElementById("image1").src = "images/image2_2.jpg";
        }
        if (numero == 3) {
          document.getElementById("image1").src = "images/image3_2.jpg";
        }
        if (numero == 4) {
          document.getElementById("image1").src = "images/image4.jpg";
        }
        if (numero == 5) {
          document.getElementById("image1").src = "images/image5.jpg";
        }
        if (numero > 5) {
          numero = 1;
          document.getElementById("image1").src = "images/image1.jpg";
        }
      }
    </script>
  </body>
</html>
